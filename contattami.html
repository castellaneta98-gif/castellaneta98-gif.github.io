    <main class="container my-5">
        <section id="contact" class="contact__section">
            <h2 class="section-title">CONTATTAMI</h2>
            <div class="contact__form shadow">
                <form action="#" method="post" class="needs-validation">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="nome" name="nome" placeholder="Il tuo nome" required>
                    </div>
                    <div class="mb-3">
                        <label for="cognome" class="form-label">Cognome</label>
                        <input type="text" class="form-control" id="cognome" name="cognome" placeholder="Il tuo cognome" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="nome@esempio.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="messaggio" class="form-label">Messaggio</label>
                        <textarea class="form-control" id="messaggio" name="messaggio" rows="5" placeholder="Scrivi qui il tuo messaggio..." required></textarea>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary px-5 py-2">Invia</button>
                    </div>
                </form>
            </div>
        </section>
